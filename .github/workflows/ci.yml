name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Boing.slnx

      - name: Build
        run: dotnet build Boing.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test Boing.slnx --configuration Release --no-build --no-restore
